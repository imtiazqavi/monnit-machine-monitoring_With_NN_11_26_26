<!doctype html><html><head><title>Login</title><style>
body{font-family:Arial;background:linear-gradient(135deg,#123b5d,#2685b5);height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.box{background:white;width:420px;max-width:90%;padding:38px;border-radius:16px;text-align:center;box-shadow:0 20px 60px #0004}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}.btn{width:100%;padding:12px;background:#1769aa;color:white;border:0;border-radius:7px}
</style></head><body><div class="box"><h1>Industrial Machine Monitoring</h1><p>Authorized users only</p>
{% if error %}<p style="color:#b42318">{{error}}</p>{% endif %}
<form method="post"><input name="username" placeholder="Username"><input type="password" name="password" placeholder="Password">
<button class="btn">Sign in</button></form></div></body></html>
