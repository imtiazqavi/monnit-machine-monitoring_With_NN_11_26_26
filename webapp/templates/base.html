<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Machine Monitoring{% endblock %}</title>
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script><style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}nav{background:#123b5d;color:white;padding:14px 24px;display:flex;justify-content:space-between}nav a{color:white;text-decoration:none;margin-right:18px}.wrap{max-width:1500px;margin:24px auto;padding:0 18px}.card{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.machine{display:block;text-decoration:none;color:inherit;border-left:7px solid #2875a7}.btn{display:inline-block;background:#1769aa;color:white!important;padding:9px 14px;border-radius:6px;border:0;text-decoration:none;cursor:pointer}.btn.secondary{background:#64748b}.btn.green{background:#198754}.muted{color:#6b7280}.bad{color:#b42318}.good{color:#12733a}.warn{color:#a15c00}input,select,textarea{padding:8px;border:1px solid #bbb;border-radius:5px;box-sizing:border-box}textarea{width:100%;min-height:90px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#eef2f5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.grey{opacity:.48;background:#eee}.metric-card{border:1px solid #ddd;border-radius:9px;padding:14px;margin:8px 0}code,pre{background:#eef2f5;padding:3px 6px;border-radius:4px}.big{font-size:30px;font-weight:700}
</style></head><body><nav><div><a href="/"><b>Industrial Machine Monitoring</b></a><a href="/history">Historical Data</a><a href="/sensors/battery">Sensor Battery Health</a><a href="/machines/new">Add Machine</a>{% if role=='admin' %}<a href="/admin/users">Users</a>{% endif %}</div><div>{% if user %}{{user}} &nbsp; <a href="/logout">Sign out</a>{% endif %}</div></nav><div class="wrap">{% block body %}{% endblock %}</div></body></html>
